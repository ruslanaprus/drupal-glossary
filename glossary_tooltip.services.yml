services:
  glossary_tooltip.processor:
    class: Drupal\glossary_tooltip\Service\GlossaryProcessor
    arguments:
      - '@entity_type.manager'
      - '@cache.default'
      - '@logger.channel.glossary_tooltip'

  logger.channel.glossary_tooltip:
    class: Drupal\Core\Logger\LoggerChannel
    factory: ['@logger.factory', 'get']
    arguments: ['glossary_tooltip']
