services:
  glossary_tooltip.repository:
    class: Drupal\glossary_tooltip\GlossaryRepository
    arguments:
      - '@entity_type.manager'
      - '@cache.default'
      - '@logger.channel.glossary_tooltip'

  glossary_tooltip.highlighter:
    class: Drupal\glossary_tooltip\GlossaryHighlighter
    arguments:
      - '@logger.channel.glossary_tooltip'

  glossary_tooltip.processor:
    class: Drupal\glossary_tooltip\GlossaryProcessor
    arguments:
      - '@glossary_tooltip.repository'
      - '@glossary_tooltip.highlighter'

  logger.channel.glossary_tooltip:
    class: Drupal\Core\Logger\LoggerChannel
    factory: ['@logger.factory', 'get']
    arguments: ['glossary_tooltip']
